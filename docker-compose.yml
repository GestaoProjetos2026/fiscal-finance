services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: container-fisc-backend
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
      - ./docs:/docs
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/v1/fisc/products')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: container-fisc-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

