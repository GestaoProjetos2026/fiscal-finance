services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: container-fisc-backend
    ports:
      - "5000:5000"
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: container-fisc-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - BACKEND_HOST=backend
    networks:
      - erp-network

networks:
  erp-network:
    name: core-engine-main_erp-network
    external: true

