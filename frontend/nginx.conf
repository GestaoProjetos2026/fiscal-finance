server {
    listen 80;
    server_name localhost;

    # Dynamic DNS resolver injected via environment variable
    resolver ${DNS_RESOLVER} valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /v1/ {
        set $backend_service "${BACKEND_HOST}";
        proxy_pass http://$backend_service:5000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger docs
    location /docs {
        set $backend_service "${BACKEND_HOST}";
        proxy_pass http://$backend_service:5000/docs;
        proxy_set_header Host $host;
    }
    
    location /apispec.json {
        set $backend_service "${BACKEND_HOST}";
        proxy_pass http://$backend_service:5000/apispec.json;
        proxy_set_header Host $host;
    }

    location /flasgger_static/ {
        set $backend_service "${BACKEND_HOST}";
        proxy_pass http://$backend_service:5000/flasgger_static/;
        proxy_set_header Host $host;
    }
}

