server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /v1/ {
        proxy_pass http://fiscal-finance-backend-svc:5000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger docs
    location /docs {
        proxy_pass http://fiscal-finance-backend-svc:5000/docs;
        proxy_set_header Host $host;
    }
    
    location /apispec.json {
        proxy_pass http://fiscal-finance-backend-svc:5000/apispec.json;
        proxy_set_header Host $host;
    }

    location /flasgger_static/ {
        proxy_pass http://fiscal-finance-backend-svc:5000/flasgger_static/;
        proxy_set_header Host $host;
    }
}
