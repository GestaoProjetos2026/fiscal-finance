name: Deploy Squad

on:
  push:
    branches: [ "main", "staging" ]

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fiscal-finance-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fiscal-finance-frontend:latest

      # Deploy Remoto na VM do Professor via SSH
      - name: Deploy na VM via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Criar rede para comunicação entre os containers, se não existir
            docker network create fisc-net || true

            # Pull das imagens
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fiscal-finance-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fiscal-finance-frontend:latest

            # Parar e remover containers antigos
            docker stop backend frontend || true
            docker rm backend frontend || true

            # Rodar Backend
            docker run -d --name backend --network fisc-net -v /home/${{ secrets.VM_USER }}/data:/app/data ${{ secrets.DOCKERHUB_USERNAME }}/fiscal-finance-backend:latest

            # Rodar Frontend (expondo porta 8080)
            docker run -d --name frontend --network fisc-net -p 8080:80 ${{ secrets.DOCKERHUB_USERNAME }}/fiscal-finance-frontend:latest
